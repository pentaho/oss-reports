# Product configuration for automated SBOM publishing
# (.github/workflows/publish-sbom.yml -> .github/scripts/publish/publish.py).
#
# Routing: a pdia-security (Xray) build name belongs to the project whose key
# equals it or prefixes it followed by "-"; the longest matching key wins.
#   pdia-11.0                             -> pdia
#   pdi-openlineage-plugin-ee-release-0.7 -> pdi-openlineage-plugin-ee
#   pdc-docker-deployment-release         -> pdc-docker-deployment
#
# Version: the build number is split into the displayed version and build with
# version_pattern (named groups "version" and "build"). The default is
# '^(?P<version>.+)-(?P<build>[^-]+)$', e.g. 11.0.0.3-312 -> 11.0.0.3 / 312.
# version_segments pads the version with ".0" up to that many segments.
# The workflow's version/build inputs, then a "release" block in the run's
# publish.json, take precedence over the pattern.
#
# Published files: {folder}/sbom-{safe-build-name}-{build-number}.zip|.pdf, where
# the safe build name replaces ":" with "-" and "/" with "_" (as pdia-security).
#
# Each project needs a <!-- project:{key} --> ... <!-- /project:{key} --> table
# body in index.html; the rows are generated from releases.json.

projects:

  pdia:
    name: "Pentaho Data Integration and Analytics"
    description: "Full Pentaho platform suite SBOM"
    folder: "pentaho-suite"

  pdi-openlineage-plugin-ee:
    name: "Pentaho Data Lineage Plugin"
    description: "OpenLineage plugin for Pentaho Data Integration"
    folder: "openlineage-plugin"

  pdc-docker-deployment:
    name: "Pentaho Data Catalog"
    description: "Pentaho Data Catalog SBOM"
    folder: "pentaho-catalog"
    # release-v11.0.0-c99927d -> 11.0.0.0 / c99927d
    version_pattern: '^release-v(?P<version>\d+(?:\.\d+)*)-(?P<build>[0-9a-f]+)$'
    version_segments: 4
